{% load static %}

<footer id="site-footer" class="site-footer">
    <div class="container footer-content">
        <div class="footer-instagram">
            <span class="footer-instagram-icon" aria-hidden="true">
                <img src="{% static 'storefront/assets/images/social/instagram-white.svg' %}" width="24" height="24" alt="">
            </span>
            <div>
                <p class="footer-label">اینستاگرام دانا شاپ</p>
                {% if instagram_handle %}
                    <a class="footer-instagram-link" href="https://www.instagram.com/{{ instagram_handle|urlencode }}/" target="_blank" rel="noopener noreferrer" dir="ltr">@{{ instagram_handle }}</a>
                {% else %}
                    {# Replace with the shop's Instagram handle when provided. #}
                    <span class="footer-placeholder">آیدی اینستاگرام</span>
                {% endif %}
            </div>
        </div>
        {# Reserved for the shop's official eNAMAD embed. #}
        <div class="footer-enamad" aria-label="جای نماد اعتماد الکترونیکی">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/></svg>
            <span>جای اینماد</span>
        </div>
    </div>
</footer>
