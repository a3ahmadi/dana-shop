{% load static %}

<!-- HEADER -->
<header id="topHeader"
        class="py-3 bg-white dark:bg-custom-dark border-b border-gray-200 dark:border-gray-700 shadow-md dark:shadow-none sticky top-0 start-0 end-0 z-20 transition-colors duration-300">

    <div class="container">
        <!-- row top header -->
        <div class="header-top-row grid place-items-center gap-3 grid-cols-12">
            <!-- responsive menu -->
            <div class="header-menu-slot xl:hidden col-span-4 w-full">
                <button type="button" class="header-menu-button" onclick="toggleOffcanvas('offcanvas-right')" aria-label="باز کردن منو">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                         stroke="currentColor" class="size-6 dark:text-white">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M3.75 6.75h16.5M3.75 12H12m-8.25 5.25h16.5"/>
                    </svg>
                </button>
            </div>
            <!-- typographic store name -->
            <div class="header-brand-slot xl:col-span-2 xl:order-1 order-2 col-span-4 w-full">
                <a href="{% url 'storefront:home' %}" class="header-wordmark" aria-label="دانا شاپ، صفحه اصلی">
                    <span>دانا</span><span>شاپ</span>
                </a>
            </div>
            <!-- search and filter -->
            <div class="header-search-slot xl:col-span-6 xl:order-2 order-4 col-span-12 w-full">
                <div class="flex items-center w-full justify-between">
                    <!-- search -->
                    <div class="flex w-full items-center">
                        <!--Search component-->
                        <form id="catalogSearchForm" method="get" action="{% url 'storefront:products' %}" class="header-search-form relative flex items-center w-full" role="search">
                            <input type="search" name="search" id="catalogSearchInput" autocomplete="off" aria-controls="catalogSearchResults" aria-expanded="false"
                                   class="w-full appearance-none rounded-xl border border-gray-300 dark:border-gray-700 py-3 ps-4 pe-10 placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-primary-500 focus:border-transparent bg-white dark:bg-custom-dark text-gray-900 dark:text-gray-100 transition-colors duration-300"
                                   placeholder="جستجوی محصولات ...."/>

                            <button id="catalogSearchButton" type="submit" aria-label="جستجوی محصولات" class="p-2 rounded-3xl absolute end-1 hover:opacity-90 transition-opacity">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                     stroke-width="1.5" stroke="currentColor" class="size-6">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                          d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
                                </svg>
                            </button>
                            <!--Search results-->
                            <div id="catalogSearchResults" role="status" aria-live="polite"
                                 class="absolute top-13 end-0 start-0 z-10 bg-white dark:bg-custom-dark border border-gray-300 dark:border-gray-700 rounded-xl shadow-lg dark:shadow-[0_4px_12px_rgba(0,0,0,0.4)] overflow-hidden transition-colors duration-300 hidden">
                                <!-- The results content will be filled by JavaScript -->
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <!-- login, basket and dark mode -->
            <div class="header-actions-slot xl:col-span-4 col-span-4 order-3 w-full">
                <div class="header-actions">
                    <div class="header-tools">
                        <!-- basket -->
                        <a href="{% url 'storefront:cart' %}" aria-label="مشاهده سبد خرید" class="header-cart-button header-icon-button relative flex">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                 stroke-width="1.5" stroke="currentColor" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                      d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"/>
                            </svg>
                            <span
                                    class="size-4 text-sm -top-2 -start-2 absolute bg-secondary dark:bg-primary-400 text-white dark:text-gray-100 rounded-lg text-center shadow-sm dark:shadow-[0_0_4px_rgba(255,255,255,0.2)] transition-colors duration-300" data-cart-count>0</span>
                        </a>
                        <!-- dark mode -->
                        <div>
                            <button id="dark-mode-toggle" type="button" class="header-icon-button" aria-label="تغییر حالت روشن و تاریک">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                     stroke-width="1.5" stroke="currentColor"
                                     class="size-6 dark:block hidden dark:text-white">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                          d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"/>
                                </svg>
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                     stroke-width="1.5" stroke="currentColor"
                                     class="size-6 dark:hidden block dark:text-white">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                          d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="xl:inline-block hidden h-10 w-px bg-gray-200 dark:bg-gray-700">
                    </div>
                    <!-- login -->
                    <a href="{% if request.user.is_authenticated %}{% url 'storefront:panel' %}{% else %}{% url 'storefront:login' %}{% endif %}"
                       aria-label="{% if request.user.is_authenticated %}حساب کاربری{% else %}ورود / ثبت نام{% endif %}"
                       class="header-account bg-white dark:bg-custom-dark text-gray-900 dark:text-gray-100 flex xl:py-2 xl:px-3 xl:border border-gray-300 dark:border-gray-700 rounded-lg hover:bg-gray-100 dark:hover:bg-[#1f242c] transition-colors duration-200">

                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                             stroke="currentColor" class="xl:size-6 lg:me-2 size-7">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
                        </svg>
                        <span class="xl:inline-block hidden">{% if request.user.is_authenticated %}حساب کاربری{% else %}ورود / ثبت نام{% endif %}</span>
                    </a>
                </div>
            </div>
        </div>

        <div class="header-navigation">
            <nav aria-label="منوی اصلی">
                <ul class="header-nav-list">
                    <li>
                        <a href="{% url 'storefront:home' %}" class="header-nav-link">
                            <span class="nav-sticker nav-sticker-home" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21v-8h6v8"/></svg>
                            </span>
                            <span>صفحه اصلی</span>
                        </a>
                    </li>
                    <li>
                        <a href="/products/" class="header-nav-link">
                            <span class="nav-sticker nav-sticker-products" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l1 14H4L5 7Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2M9 13c0 4 6 4 6 0"/></svg>
                            </span>
                            <span>محصولات</span>
                        </a>
                    </li>
                    <li>
                        <a href="/#categories" class="header-nav-link">
                            <span class="nav-sticker nav-sticker-categories" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><path d="M17.5 2v9M13 6.5h9"/></svg>
                            </span>
                            <span>دسته‌بندی‌ها</span>
                        </a>
                    </li>
                    {% if request.user.is_authenticated %}
                    <li>
                        <a href="{% url 'storefront:panel' %}?tab=orders" class="header-nav-link">
                            <span class="nav-sticker nav-sticker-orders" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5v9l-9 5-9-5V8l9-5ZM3 8l9 5 9-5M12 13v9M7.5 5.5l9 5V15"/></svg>
                            </span>
                            <span>سفارش‌های من</span>
                        </a>
                    </li>
                    {% endif %}
                    <li>
                        <a href="/#site-footer" class="header-nav-link">
                            <span class="nav-sticker nav-sticker-contact" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l-2 2V11.5a9.5 9.5 0 0 1 19 0Z"/><path d="M7 11h.01M12 11h.01M17 11h.01" stroke-width="3"/></svg>
                            </span>
                            <span>تماس با ما</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</header>
<!-- END HEADER -->
