{% with current_page=request.resolver_match.url_name %}
<nav id="navMenuMobile" class="mobile-dock" aria-label="منوی پایین موبایل">
    <div class="mobile-dock-items">
        <a href="{% url 'storefront:home' %}" class="mobile-dock-item"{% if current_page == 'home' %} aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg>
            <span class="mobile-dock-label">خانه</span>
        </a>

        <a id="mobileSearchButton" href="#catalogSearchInput" class="mobile-dock-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 4.5 4.5"/></svg>
            <span class="mobile-dock-label">جستجو</span>
        </a>

        <button type="button" onclick="scrollToTop(event)" class="mobile-dock-item mobile-dock-top" aria-label="بازگشت به بالای صفحه">
            <span class="mobile-dock-top-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
            </span>
            <span class="mobile-dock-label">بالا</span>
        </button>

        <a href="{% url 'storefront:cart' %}" class="mobile-dock-item" aria-label="مشاهده سبد خرید"{% if current_page == 'cart' %} aria-current="page"{% endif %}>
            <span class="mobile-dock-cart-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14l1 14H4L5 7Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg>
                <span class="mobile-dock-badge" data-cart-count>0</span>
            </span>
            <span class="mobile-dock-label">سبد خرید</span>
        </a>

        <a href="{% if request.user.is_authenticated %}{% url 'storefront:panel' %}{% else %}{% url 'storefront:login' %}{% endif %}" class="mobile-dock-item"{% if current_page == 'panel' or current_page == 'login' %} aria-current="page"{% elif current_page == 'panel_order_detail' %} aria-current="location"{% endif %}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v2"/></svg>
            <span class="mobile-dock-label">حساب من</span>
        </a>
    </div>
</nav>
{% endwith %}
